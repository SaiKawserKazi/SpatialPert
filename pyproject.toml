[project]
name = "spatialpert"
version = "0.2.0"
description = "SpatialPert: does tissue location change what a gene knockout does? Domain-aware analysis of spatial CRISPR screens"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.12.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "python-docx>=1.2.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
gnn = [
    "torch>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "statsmodels>=0.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "PT", "SIM", "ARG", "PTH", "NPY", "RUF", "D", "ANN", "PL", "BLE", "S"]
ignore = ["D203", "D213", "ANN401", "PLR2004", "N803", "N806"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN202", "D100", "D101", "D102", "D103", "D104", "ANN001", "ANN201", "S101", "PLR2004", "PLC0415", "E501"]
"scripts/*" = ["D100", "D103", "T201", "S101", "E501", "PLR0915", "PLR0914"]
# Vendored docx formatting toolkit (shared with TransPert/CanPert): rendering utility, not science.
"src/spatialpert/docxkit.py" = ["D101", "D102", "D103", "D105", "D107", "ANN001", "ANN201", "ANN202", "PLR0913", "PLR0917", "E501", "N803", "PLC0415", "RUF001"]
"src/spatialpert/references.py" = ["RUF001", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["scipy.*", "matplotlib.*", "h5py.*", "sklearn.*", "docx.*", "statsmodels.*", "torch.*"]
ignore_missing_imports = true
